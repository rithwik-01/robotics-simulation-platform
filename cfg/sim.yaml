defaults:
  - _self_

# Number of simulated robots. Values greater than 1 namespace
# topics and frames per robot as unitree_go2_{i}/...
num_envs: 1
# Control frequency in Hz. Must divide 200 evenly (sim dt is 0.005 s).
freq: 40
# Follow the first robot with the viewport camera.
camera_follow: True
# Simulation scene. One of: obstacle-dense, obstacle-medium,
# obstacle-sparse, warehouse, warehouse-forklifts,
# warehouse-shelves, full-warehouse.
env_name: obstacle-dense

sensor:
  enable_lidar: True
  enable_camera: True
  color_image: True
  depth_image: True
  semantic_segmentation: True

sim_app:
  anti_aliasing: 0
  width: 1280
  height: 720
  hide_ui: False
